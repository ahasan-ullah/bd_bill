name: bd_bill
description: "Smart Bangladesh electricity bill calculator and PDF invoice generator based on official BERC tariff slabs."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  intl: ^0.20.3
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

dependency_overrides:
  image: 4.10.1


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - assets/fonts/

